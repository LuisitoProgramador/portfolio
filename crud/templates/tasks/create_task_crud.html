{% extends 'layout_crud.html' %}

{% block content %}
<main class="container">
    <div class="row">
        <div class="col-md-4 offset-md-4 mt-4">
            <form method="POST" class="card card-body">
                <h1>Crated task</h1>

                {% if error %}
                {{error}}
                {% endif %}

                {% csrf_token %}
                {{form.as_p}}
                <button class="btn btn-primary">
                    Save
                </button>
            </form>
        </div>
    </div>
</main>
{% endblock %}
